name: Test for changes on main branch
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/test.yml'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/test.yml'
      - 'docs/**'
  workflow_dispatch:
  # Allows you to run this workflow manually from the Actions tab

env:
  build-number: ${GITHUB_RUN_NUMBER}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Tests
        run: make -C .tests test
